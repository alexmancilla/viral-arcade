name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
  eas-update-preview:
    # Opt-in: set repository variable EAS_PREVIEW=true and secret EXPO_TOKEN. Same-repo PRs only so forks never see the token.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.EAS_PREVIEW == 'true'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish to the shared preview channel (latest PR wins; preview APKs are built on channel "preview")
        working-directory: apps/arcade
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: eas update --channel preview --message "PR #${{ github.event.number }}: $PR_TITLE" --non-interactive
